name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  # nuova stella sul repo: si ricostruisce il sito per aggiornare il contatore nell'header (letto in fase di build)
  watch:
    types: [started]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /gitFolio
          # Repository variables (Settings > Secrets and variables > Actions > Variables). La chiave anon e' pubblica per progetto.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Nell'elenco "Deployments" del repo resta solo il deploy più recente: i precedenti vengono disattivati ed eliminati.
  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Delete older github-pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api --paginate "repos/$REPO/deployments?environment=github-pages&per_page=100" --jq '.[].id' | sort -rn)
          latest=$(echo "$ids" | head -n 1)
          for id in $(echo "$ids" | tail -n +2); do
            # GitHub elimina solo deployment inattivi: prima si marca "inactive", poi si cancella
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive --silent || true
            gh api -X DELETE "repos/$REPO/deployments/$id" --silent && echo "deleted $id" || echo "could not delete $id"
          done
          echo "kept $latest"
